<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghar Docs">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ghar Documents</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--pr:#4f46e5;--pr2:#eef0ff;--bd:#e4e7ee;--rd:#e5484d;--am:#b7791f;--am2:#fff4d6}
@media(prefers-color-scheme:dark){:root{--bg:#0f131c;--card:#181e2b;--tx:#e8ecf4;--mu:#97a0b3;--pr:#818cf8;--pr2:#232a44;--bd:#262e40;--am:#f6c453;--am2:#3a2f12}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--pr);color:#fff;font-weight:600}
button.g{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--rd)}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.hide{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:var(--card);border-radius:20px;padding:32px 26px;width:100%;max-width:370px;box-shadow:0 10px 40px #0001;display:flex;flex-direction:column;gap:12px}
.box .ic{font-size:50px;text-align:center}.box h1{margin:0;text-align:center}.box p{color:var(--mu);text-align:center;margin:0}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h2{margin:0;font-size:18px;flex:1;min-width:150px}header small{color:var(--mu)}
main{max-width:1000px;margin:0 auto;padding:16px 16px 90px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}.bar h3{margin:0;flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card .t{font-size:34px}.card b{word-break:break-word;font-size:14px;padding-right:22px}.card small{color:var(--mu)}
.card .a{display:flex;gap:6px;margin-top:6px}.card .a button{flex:1;padding:7px}
.ck{position:absolute;top:12px;right:12px;width:20px;height:20px;padding:0;accent-color:var(--pr)}
.fold{cursor:pointer}.fold:hover{border-color:var(--pr)}
.empty{text-align:center;color:var(--mu);padding:50px 10px;grid-column:1/-1}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;font-weight:600;width:fit-content}
.bd.red{background:#fde2e3;color:#b4232a}.bd.amb{background:var(--am2);color:var(--am)}
#rem{background:var(--am2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;flex-direction:column;gap:6px}
#rem .ri{cursor:pointer;padding:4px 0}
#q{margin:10px 0 4px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.mb{background:var(--card);border-radius:16px;width:100%;max-width:820px;max-height:94vh;display:flex;flex-direction:column;overflow:auto}
.mb .h{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.mb .h b{flex:1;min-width:120px;word-break:break-word}
.pv{display:flex;align-items:center;justify-content:center;min-height:280px;background:var(--bg)}
.pv img,.pv iframe{max-width:100%;max-height:75vh;border:0}.pv iframe{width:100%;height:75vh}
.form{padding:18px;display:flex;flex-direction:column;gap:12px}
.tpl{display:grid;grid-template-columns:1fr 1fr}.tpl button{padding:16px 8px}
.row2{display:flex;gap:8px}.row2 button{flex:1}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row span{flex:1;min-width:140px}
.err{color:var(--rd);text-align:center;font-size:14px;min-height:18px}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 30px #0003;border-radius:30px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:10px;z-index:15;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:30px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center"><div class="box">
  <div class="ic">🏠📁</div><h1>Ghar Documents</h1><p>Apna username aur password daalo</p>
  <div><label>Username</label><input id="lu" autocapitalize="none" autocomplete="username"></div>
  <div><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <div class="err" id="le"></div>
  <button onclick="doLogin()">Login</button>
  <button id="setupLink" class="g hide" onclick="show('setup')">👑 Koi user nahi hai? Pehla Admin banao</button>
</div></div>

<!-- FIRST TIME ADMIN SETUP -->
<div id="setup" class="center hide"><div class="box">
  <div class="ic">🛡️</div><h1>Admin Setup</h1><p>Ye sirf ek baar hota hai. Ye account sabka manager hoga.</p>
  <div><label>Aapka naam</label><input id="sn"></div>
  <div><label>Username</label><input id="su" autocapitalize="none"></div>
  <div><label>Password (kam se kam 6 akshar)</label><input id="sp" type="password"></div>
  <div class="err" id="se"></div>
  <button onclick="doSetup()">Admin banao</button>
  <button class="g" onclick="show('login')">Wapas</button>
</div></div>

<!-- APP -->
<div id="app" class="hide">
  <header><span style="font-size:24px">📁</span><h2>Ghar Documents <small id="who"></small></h2>
    <button class="g hide" id="inst" onclick="installApp()">📲 App install</button>
    <button class="g" id="adm" onclick="adminPanel()">⚙ Admin</button>
    <button class="g" onclick="chPw()">🔑</button>
    <button class="g" onclick="auth.signOut()">Logout</button></header>
  <main>
    <div id="rem" class="hide"></div>
    <input id="q" placeholder="🔍 Sabhi documents me naam se khojo..." oninput="render()">
    <div class="chips" id="chips"></div>
    <div class="bar"><h3 id="ttl"></h3><span id="acts" style="display:flex;gap:8px;flex-wrap:wrap"></span></div>
    <div class="grid" id="grid"></div>
  </main>
  <div id="selbar" class="hide"><span id="selc"></span><button onclick="shareSel()">📲 WhatsApp</button><button class="g" onclick="clearSel()">✕</button></div>
</div>

<div id="modal" class="modal hide" onclick="if(event.target===this)closeM()"><div class="mb" id="mb"></div></div>
<div id="toast" class="hide"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// ====== FIREBASE CONFIG ======
const CFG={
  apiKey:"AIzaSyAAIe5981RwbdW4dTnWLajTeDHMbBMQhZs",
  authDomain:"dialog-box-63269.firebaseapp.com",
  projectId:"dialog-box-63269",
  storageBucket:"dialog-box-63269.firebasestorage.app",
  messagingSenderId:"9414978030",
  appId:"1:9414978030:web:89c3330c8abc76734906ff"
};
// ====== APPS SCRIPT KA /exec LINK YAHAN DAALO (https://script.google.com/macros/s/.../exec) ======
const DRIVE_URL="PASTE_APPS_SCRIPT_URL_HERE";
// ==================================================================================================
const app=firebase.initializeApp(CFG), app2=firebase.initializeApp(CFG,'sec');
const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);
const okU=u=>/^[a-z0-9._-]{3,30}$/.test(u.trim().toLowerCase());
const UERR='Username me sirf English akshar, number, . _ - use karo (kam se kam 3, space ya @ nahi)';
const em=u=>u.trim().toLowerCase()+'@ghar-docs.app';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.ceil(b/1024)+' KB';
const icon=m=>m.startsWith('image/')?'🖼️':m==='application/pdf'?'📕':'📄';
const ext=f=>{const m=f.name.match(/\.[a-z0-9]+$/i);if(m)return m[0];const t=(f.type||'').split('/')[1];return t?'.'+t.replace('jpeg','jpg'):''};
const dayDiff=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const TPL=[
  {k:'aadhar',ico:'🪪',folder:'Aadhar Card',slots:['Aadhar Front','Aadhar Back']},
  {k:'pan',ico:'💳',folder:'PAN Card',slots:['PAN Card']},
  {k:'voter',ico:'🗳️',folder:'Voter ID',slots:['Voter ID Front','Voter ID Back']},
  {k:'dl',ico:'🚗',folder:'Driving Licence',slots:['Driving Licence Front','Driving Licence Back']}
];
let me=null,members=[],folders=[],docs=[],users=[],cm=null,cf=null,unsubs=[],started=false,slotF={};
const sel=new Set();

function show(id){['login','setup','app'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t._t);if(ms)t._t=setTimeout(()=>t.classList.add('hide'),ms)}
function modal(h){$('mb').innerHTML=h;$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide');$('mb').innerHTML=''}
const fail=e=>/invalid|wrong|not-found|credential/i.test(e.code+e.message)?'Username ya password galat hai':e.message;

// ---- first-time check ----
// Admin banane ka button tab dikhao jab abhi koi admin set up nahi hua (ya check na ho paye)
function checkSetup(){
  db.collection('config').doc('setup').get()
    .then(s=>$('setupLink').classList.toggle('hide',s.exists))
    .catch(()=>$('setupLink').classList.remove('hide'));
}
checkSetup();

// ---- login / setup ----
async function doLogin(){
  $('le').textContent='';
  if(!okU($('lu').value)){$('le').textContent=UERR;return}
  try{await auth.signInWithEmailAndPassword(em($('lu').value),$('lp').value)}catch(e){$('le').textContent=fail(e)}
}
async function doSetup(){
  const n=$('sn').value.trim(),u=$('su').value.trim(),p=$('sp').value;
  if(!okU(u)){$('se').textContent=UERR;return}
  if(!n||p.length<6){$('se').textContent='Sab bharo, password 6+ akshar ka ho';return}
  $('se').textContent='';let c;
  try{
    c=await auth.createUserWithEmailAndPassword(em(u),p);
    await db.collection('users').doc(c.user.uid).set({name:n,username:u.toLowerCase(),role:'admin',active:true});
    await db.collection('config').doc('setup').set({done:true,at:Date.now()});
  }catch(e){
    if(c&&c.user){try{await c.user.delete()}catch(x){}} // adhura account na bache, dobara try kar sako
    $('se').textContent=e.code==='auth/email-already-in-use'
      ?'Ye username pehle se bana hua hai. Login screen par isi username/password se login karo, admin banane ka option wahin aa jayega'
      :e.message+(/permission/i.test(e.message)?' (Firestore rules publish kiye?)':'');
  }
}

auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];started=false;me=null;sel.clear();clearTimeout(window._np);
  if(!u){show('login');checkSetup();return}
  unsubs.push(db.collection('users').doc(u.uid).onSnapshot(s=>{
    if(!s.exists){ // profile abhi nahi mila: thoda ruko (naya user ban raha ho sakta hai)
      clearTimeout(window._np);
      window._np=setTimeout(()=>noProfile(u),4000);
      return;
    }
    clearTimeout(window._np);
    me={id:s.id,...s.data()};
    if(me.active!==true){$('le').textContent='Is login ka access band hai ya profile me active=true nahi hai';me=null;auth.signOut();return}
    if(!started){started=true;startApp()}
    render();
  },e=>{$('le').textContent='Firestore se profile nahi padh paaye: '+e.message+' (Firestore rules publish kiye?)';auth.signOut()}));
});

// Login ho gaya par Firestore me profile nahi hai
async function noProfile(u){
  if(me)return;
  let first=false;
  try{first=!(await db.collection('config').doc('setup').get()).exists}catch(e){}
  if(first&&confirm('Abhi koi admin set up nahi hua hai, aur is login ka profile bhi nahi hai.\n\nIs login ko ADMIN bana dein?')){
    const n=prompt('Admin ka naam:','Admin');
    if(n&&n.trim()){
      try{
        await db.collection('users').doc(u.uid).set({name:n.trim(),username:(u.email||'').split('@')[0],role:'admin',active:true});
        await db.collection('config').doc('setup').set({done:true,at:Date.now()});
        return; // profile mil gaya, app apne aap khul jayega
      }catch(e){$('le').textContent='Admin banane me error: '+e.message+(/permission/i.test(e.message)?' (Firestore rules publish kiye?)':'');auth.signOut();return}
    }
  }
  $('le').textContent='Profile nahi mila. Firestore > users me ek document chahiye jiska Document ID bilkul ye ho: '+u.uid+' (username nahi, ye UID)';
  auth.signOut();
}

function _snap(q,cb){return q.onSnapshot(cb,e=>toast('Data nahi padh paaye: '+e.message,6000))}
function startApp(){
  show('app');
  unsubs.push(_snap(db.collection('members').orderBy('name'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));if(!members.find(m=>m.id===cm)){cm=members[0]?.id||null;cf=null}render()}));
  unsubs.push(_snap(db.collection('folders').orderBy('createdAt'),s=>{folders=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  unsubs.push(_snap(db.collection('docs').orderBy('createdAt','desc'),s=>{docs=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
  unsubs.push(_snap(db.collection('users'),s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));}));
}

// ---- helpers for cards ----
function expBadge(d){
  if(!d.expiry)return '';
  const n=dayDiff(d.expiry);
  if(n<0)return `<span class="bd red">❌ ${-n} din pehle expire</span>`;
  if(n<=30)return `<span class="bd amb">⏰ ${n} din baaki</span>`;
  return `<small>📅 Expiry: ${esc(d.expiry)}</small>`;
}
function docCard(d,showPath){
  const m=members.find(x=>x.id===d.memberId),f=folders.find(x=>x.id===d.folderId);
  return `<div class="card"><input type="checkbox" class="ck" ${sel.has(d.id)?'checked':''} onchange="tog('${d.id}',this.checked)">
    <div class="t">${icon(d.mime)}</div><b>${esc(d.name)}</b>
    ${showPath?`<small>👤 ${esc(m?m.name:'?')} / 📁 ${esc(f?f.name:'?')}</small>`:''}
    <small>${size(d.size)} · ${new Date(d.createdAt).toLocaleDateString('hi-IN')}</small>${expBadge(d)}
    <div class="a"><button class="g" title="Dekho" onclick="openDoc('${d.id}')">👁</button><button class="g" title="Download" onclick="dl('${d.id}')">⬇</button><button class="g" title="WhatsApp" onclick="share('${d.id}')">📲</button><button class="g" title="Badlo" onclick="editDoc('${d.id}')">✏</button></div></div>`;
}
function reminders(){
  const el=$('rem');
  const r=docs.filter(d=>d.expiry&&dayDiff(d.expiry)<=30).sort((a,b)=>dayDiff(a.expiry)-dayDiff(b.expiry));
  if(!r.length){el.classList.add('hide');return}
  el.classList.remove('hide');
  el.innerHTML=`<b>⏰ Expiry yaad dilana (${r.length})</b>`+r.slice(0,5).map(d=>{
    const m=members.find(x=>x.id===d.memberId),n=dayDiff(d.expiry);
    return `<div class="ri" onclick="jump('${d.memberId}','${d.folderId}')">${esc(m?m.name:'')} — ${esc(d.name)} <span class="bd ${n<0?'red':'amb'}">${n<0?'expire ho gaya':n+' din baaki'}</span></div>`;
  }).join('')+(r.length>5?`<small>+${r.length-5} aur</small>`:'');
}
function jump(m,f){cm=m;cf=f;$('q').value='';render();window.scrollTo(0,0)}

// ---- render ----
function render(){
  if(!me||$('app').classList.contains('hide'))return;
  $('who').textContent='· '+me.name+(me.role==='admin'?' (Admin)':'');
  $('adm').classList.toggle('hide',me.role!=='admin');
  reminders();selBar();
  $('chips').innerHTML=members.map(m=>`<button class="chip ${m.id===cm?'on':''}" onclick="cm='${m.id}';cf=null;$('q').value='';render()">👤 ${esc(m.name)}</button>`).join('')
    +`<button class="chip" onclick="addMember()">＋ Member</button>`;
  const q=$('q').value.trim().toLowerCase(),g=$('grid');
  if(q){
    const fl=folders.filter(f=>f.name.toLowerCase().includes(q)),dls=docs.filter(d=>d.name.toLowerCase().includes(q));
    $('ttl').textContent=`🔍 "${$('q').value.trim()}" — ${fl.length+dls.length} mile`;
    $('acts').innerHTML=`<button class="g" onclick="$('q').value='';render()">✕ Search band</button>`;
    g.innerHTML=fl.map(f=>{const m=members.find(x=>x.id===f.memberId);
      return `<div class="card fold" onclick="jump('${f.memberId}','${f.id}')"><div class="t">📁</div><b>${esc(f.name)}</b><small>👤 ${esc(m?m.name:'?')}</small></div>`}).join('')
      +dls.map(d=>docCard(d,true)).join('')||'<div class="empty">Kuch nahi mila</div>';
    return;
  }
  const m=members.find(x=>x.id===cm);
  if(!m){$('ttl').textContent='';$('acts').innerHTML='';g.innerHTML='<div class="empty">👆 Pehle "＋ Member" se kisi member ka naam jodo</div>';return}
  const f=folders.find(x=>x.id===cf&&x.memberId===cm);
  if(!f){
    cf=null;$('ttl').textContent=m.name+' ke folders';
    $('acts').innerHTML=`<button onclick="tplPicker()">🪪 Document add</button><button class="g" onclick="addFolder()">＋ Folder</button>`+(me.role==='admin'?`<button class="d" onclick="delMember()">🗑 Member</button>`:'');
    const fl=folders.filter(x=>x.memberId===cm);
    g.innerHTML=fl.map(x=>`<div class="card fold" onclick="cf='${x.id}';render()"><div class="t">📁</div><b>${esc(x.name)}</b><small>${docs.filter(d=>d.folderId===x.id).length} files</small></div>`).join('')
      ||'<div class="empty">📭 Koi folder nahi. "🪪 Document add" ya "＋ Folder" dabao</div>';
  }else{
    $('ttl').innerHTML=`<a href="#" onclick="cf=null;render();return false" style="color:var(--pr);text-decoration:none">← ${esc(m.name)}</a> / ${esc(f.name)}`;
    $('acts').innerHTML=`<button onclick="upFile(false)">⬆ Upload</button><button class="g" onclick="upFile(true)">📷 Camera</button><button class="d" onclick="delFolder()">🗑 Folder</button>`;
    const dls=docs.filter(d=>d.folderId===cf);
    g.innerHTML=dls.map(d=>docCard(d,false)).join('')||'<div class="empty">Is folder me abhi koi file nahi</div>';
  }
}

// ---- members / folders ----
async function addMember(){
  const n=prompt('Member ka naam (jaise: Hardik):');if(!n||!n.trim())return;
  const r=await db.collection('members').add({name:n.trim(),createdAt:Date.now()});cm=r.id;cf=null;
}
async function addFolder(){
  const n=prompt('Folder ka naam (jaise: Marksheet, Insurance):');if(!n||!n.trim())return;
  const r=await db.collection('folders').add({memberId:cm,name:n.trim(),createdAt:Date.now()});cf=r.id;render();
}
async function removeFiles(list){for(const d of list){try{await api('delete',{id:d.driveId})}catch(e){}await db.collection('docs').doc(d.id).delete()}}
async function delFolder(){
  const f=folders.find(x=>x.id===cf);if(!confirm(`"${f.name}" folder aur uski sabhi files delete karni hain?`))return;
  await removeFiles(docs.filter(d=>d.folderId===cf));try{await api('trashFolder',{memberName:members.find(x=>x.id===cm).name,folderName:f.name})}catch(e){}await db.collection('folders').doc(cf).delete();cf=null;
}
async function delMember(){
  const m=members.find(x=>x.id===cm);if(!confirm(`"${m.name}" ke sabhi folders aur documents delete karne hain?`))return;
  await removeFiles(docs.filter(d=>d.memberId===cm));
  for(const f of folders.filter(x=>x.memberId===cm))await db.collection('folders').doc(f.id).delete();
  try{await api('trashFolder',{memberName:m.name})}catch(e){}await db.collection('members').doc(cm).delete();
}

// ---- Drive backend ----
function driveHint(u){
  if(!u||u.startsWith('PASTE'))return 'Pehle index.html me DRIVE_URL daalo (Apps Script ka /exec link)';
  if(u.includes('/library/'))return 'DRIVE_URL galat hai: ye Library ka link hai. Web app ka /exec link chahiye';
  if(u.includes('googleusercontent.com'))return 'DRIVE_URL galat hai: ye temporary echo link hai. script.google.com/macros/s/.../exec wala link chahiye';
  return '';
}
async function api(action,p={}){
  const h=driveHint(DRIVE_URL);if(h)throw new Error(h);
  const idToken=await auth.currentUser.getIdToken();
  let t;
  try{const r=await fetch(DRIVE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,idToken,...p})});t=await r.text()}
  catch(e){throw new Error('Drive server tak nahi pahunch paaye (link ya internet check karo)')}
  let j;try{j=JSON.parse(t)}catch(e){throw new Error('Drive backend ne galat jawab diya. Apps Script me "Who has access: Anyone" aur naya version deploy check karo')}
  if(!j.ok)throw new Error(/Unknown action/.test(j.error||'')?'Code.gs purana hai. Naya Code.gs paste karke New version deploy karo':(j.error||'Drive error'));
  return j;
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function shrink(f){ // badi photo ko chhota karo (tez upload)
  if(!f.type.startsWith('image/')||f.size<1500000)return f;
  try{const im=await createImageBitmap(f),k=Math.min(1,2000/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||f),'image/jpeg',0.85));}catch(e){return f}
}
async function put(file,name,memberId,folderId,folderName,expiry){
  const m=members.find(x=>x.id===memberId),fo=folders.find(x=>x.id===folderId);
  const blob=await shrink(file);
  if(blob!==file)name=name.replace(/\.[a-z0-9]+$/i,'')+'.jpg';
  if(blob.size>12*1048576)throw new Error('File 12 MB se badi hai');
  const mime=blob.type||file.type||'application/octet-stream';
  const r=await api('upload',{memberName:m.name,folderName:folderName||fo.name,name,mime,data:await b64(blob)});
  await db.collection('docs').add({memberId,folderId,name,driveId:r.id,mime,size:blob.size,expiry:expiry||null,by:me.name,createdAt:Date.now()});
}

// ---- upload (file / camera) ----
function upFile(cam){
  const i=document.createElement('input');i.type='file';
  if(cam){i.accept='image/*';i.capture='environment'}else i.multiple=true;
  i.onchange=async()=>{
    if(!i.files.length)return;
    try{
      for(const f of i.files){
        let nm=f.name;
        if(cam){const b=prompt('Is photo ka naam likho:','Photo');nm=(b&&b.trim()?b.trim():'Photo')+ext(f)}
        toast('Upload ho raha hai: '+nm,0);await put(f,nm,cm,cf);
      }
      toast('Upload ho gaya ✅');
    }catch(e){toast(e.message)}
  };
  i.click();
}

// ---- document templates (Aadhar, PAN, Voter, DL) ----
function tplPicker(){
  modal(`<div class="h"><b>🪪 Kaun sa document add karna hai?</b><button class="g" onclick="closeM()">✕</button></div>
  <div class="form tpl">${TPL.map(t=>`<button class="g" onclick="tplForm('${t.k}')"><span style="font-size:26px">${t.ico}</span><br>${t.folder}</button>`).join('')}</div>
  <div style="padding:0 18px 18px;color:var(--mu);font-size:13px">Dusre document ke liye "＋ Folder" banao aur uske andar upload karo.</div>`);
}
function pickSlot(i,cam){
  const x=document.createElement('input');x.type='file';x.accept='image/*,application/pdf';
  if(cam){x.accept='image/*';x.capture='environment'}
  x.onchange=()=>{const f=x.files[0];if(!f)return;slotF[i]=f;$('sl'+i).textContent='✅ '+f.name};
  x.click();
}
function tplForm(k){
  const t=TPL.find(x=>x.k===k),m=members.find(x=>x.id===cm);slotF={};
  modal(`<div class="h"><b>${t.ico} ${esc(m.name)} — ${t.folder}</b><button class="g" onclick="closeM()">✕</button></div><div class="form">
  <p style="margin:0;color:var(--mu);font-size:14px">"${t.folder}" folder ban jayega, usme ${t.slots.map(s=>'"'+s+'"').join(' aur ')} save hogi.</p>
  ${t.slots.map((s,i)=>`<div><label>${esc(s)}</label><div class="row2"><button class="g" onclick="pickSlot(${i},false)">📁 File</button><button class="g" onclick="pickSlot(${i},true)">📷 Camera</button></div><small id="sl${i}" style="color:var(--mu)">Abhi chuni nahi</small></div>`).join('')}
  <div><label>Expiry date (agar hai to, optional)</label><input type="date" id="tx"></div>
  <button onclick="saveTpl('${k}')">Save karo</button></div>`);
}
async function saveTpl(k){
  const t=TPL.find(x=>x.k===k),ex=$('tx').value||null,keys=Object.keys(slotF),mid=cm;
  if(!keys.length){toast('Kam se kam ek photo chuno');return}
  try{
    closeM();toast('Save ho raha hai...',0);
    const f=folders.find(x=>x.memberId===mid&&x.name.toLowerCase()===t.folder.toLowerCase());
    const fid=f?f.id:(await db.collection('folders').add({memberId:mid,name:t.folder,createdAt:Date.now()})).id,fname=f?f.name:t.folder;
    for(const i of keys){const file=slotF[i];await put(file,t.slots[i]+ext(file),mid,fid,fname,ex)}
    cf=fid;toast(t.folder+' save ho gaya ✅');render();
  }catch(e){toast(e.message)}
}

// ---- edit: rename / move / expiry / delete ----
function editDoc(id){
  const d=docs.find(x=>x.id===id);window._ef=d.folderId;
  modal(`<div class="h"><b>✏ Document badlo</b><button class="g" onclick="closeM()">✕</button></div><div class="form">
  <div><label>Naam</label><input id="ed_n" value="${esc(d.name)}"></div>
  <div><label>Member</label><select id="ed_m" onchange="fillFol()">${members.map(m=>`<option value="${m.id}" ${m.id===d.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
  <div><label>Folder (yahan move karo)</label><select id="ed_f"></select></div>
  <div><label>Expiry date (optional)</label><input type="date" id="ed_x" value="${esc(d.expiry||'')}"></div>
  <div class="err" id="ee"></div>
  <button onclick="saveEdit('${id}')">Save karo</button>
  <button class="d" onclick="delDoc('${id}')">🗑 Ye file delete karo</button></div>`);
  fillFol();
}
function fillFol(){
  const mid=$('ed_m').value,cur=window._ef;
  $('ed_f').innerHTML=folders.filter(f=>f.memberId===mid).map(f=>`<option value="${f.id}" ${f.id===cur?'selected':''}>${esc(f.name)}</option>`).join('')||'<option value="">(is member me koi folder nahi)</option>';
}
async function saveEdit(id){
  const d=docs.find(x=>x.id===id),name=$('ed_n').value.trim(),mid=$('ed_m').value,fid=$('ed_f').value,ex=$('ed_x').value||null;
  if(!name){$('ee').textContent='Naam khali nahi ho sakta';return}
  if(!fid){$('ee').textContent='Is member me folder nahi hai, pehle folder banao';return}
  try{
    toast('Save ho raha hai...',0);
    if(name!==d.name)await api('rename',{id:d.driveId,name});
    if(fid!==d.folderId){const m=members.find(x=>x.id===mid),f=folders.find(x=>x.id===fid);await api('move',{id:d.driveId,memberName:m.name,folderName:f.name})}
    await db.collection('docs').doc(id).update({name,memberId:mid,folderId:fid,expiry:ex});
    closeM();toast('Save ho gaya ✅');
  }catch(e){$('ee').textContent=e.message;toast(e.message)}
}
async function delDoc(id){
  const d=docs.find(x=>x.id===id);if(!confirm(`"${d.name}" delete karni hai? Drive se bhi hat jayegi.`))return;
  try{closeM();await api('delete',{id:d.driveId});await db.collection('docs').doc(id).delete();sel.delete(id);toast('Delete ho gayi')}catch(e){toast(e.message)}
}

// ---- preview / download / share (Drive se) ----
const cache={};
async function fileBlob(d){
  if(cache[d.id])return cache[d.id];
  const r=await api('get',{id:d.driveId}),bin=atob(r.data),u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return cache[d.id]=new Blob([u],{type:d.mime});
}
async function openDoc(id){
  const d=docs.find(x=>x.id===id);
  modal(`<div class="h"><b>${esc(d.name)}</b><button onclick="share('${id}')">📲 WhatsApp</button><button class="g" onclick="dl('${id}')">⬇ Download</button><button class="g" onclick="closeM()">✕</button></div>
  <div class="pv" id="pv">Drive se load ho raha hai...</div>
  <div style="padding:10px;color:var(--mu);font-size:13px">Upload: ${esc(d.by||'')} · ${size(d.size)}${d.expiry?' · Expiry: '+esc(d.expiry):''}</div>`);
  try{
    const u=URL.createObjectURL(await fileBlob(d));
    $('pv').innerHTML=d.mime.startsWith('image/')?`<img src="${u}">`:d.mime==='application/pdf'?`<iframe src="${u}"></iframe>`:`<div class="empty">Is file ka preview nahi ho sakta.<br>Download karke kholo.</div>`;
  }catch(e){$('pv').textContent='Error: '+e.message}
}
async function dl(id,quiet){
  const d=docs.find(x=>x.id===id);
  try{if(!quiet)toast('Download ho raha hai...',0);const b=await fileBlob(d),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.name;a.click();if(!quiet)toast('Download ho gaya ✅')}
  catch(e){toast(e.message)}
}
async function share(id){
  const d=docs.find(x=>x.id===id);
  try{
    toast('Taiyaar ho raha hai...',0);
    const b=await fileBlob(d),f=new File([b],d.name,{type:d.mime});
    $('toast').classList.add('hide');
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){if(e.name!=='AbortError')toast(e.message);return}
  await dl(id);window.open('https://wa.me/?text='+encodeURIComponent(d.name),'_blank');
  toast('File download ho gayi, WhatsApp me attach karke bhejo',5000);
}

// ---- ek saath kai files WhatsApp par ----
function tog(id,on){on?sel.add(id):sel.delete(id);selBar()}
function selBar(){$('selbar').classList.toggle('hide',!sel.size);$('selc').textContent=sel.size+' file chuni'}
function clearSel(){sel.clear();render()}
async function shareSel(){
  const ds=[...sel].map(id=>docs.find(x=>x.id===id)).filter(Boolean);
  if(!ds.length)return;
  try{
    toast(`Taiyaar ho raha hai (${ds.length} files)...`,0);
    const fs=[];for(const d of ds)fs.push(new File([await fileBlob(d)],d.name,{type:d.mime}));
    $('toast').classList.add('hide');
    if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs});return}
  }catch(e){if(e.name!=='AbortError')toast(e.message);return}
  for(const d of ds)await dl(d.id,true);
  window.open('https://wa.me/?text='+encodeURIComponent(ds.map(d=>d.name).join(', ')),'_blank');
  toast('Files download ho gayi, WhatsApp me attach karke bhejo',5000);
}

async function chPw(){
  const p=prompt('Apna naya password (kam se kam 6 akshar):');if(!p)return;
  try{await auth.currentUser.updatePassword(p);toast('Password badal gaya ✅')}
  catch(e){toast(e.code==='auth/requires-recent-login'?'Logout karke dobara login karo, phir badlo':e.message)}

// ---- admin panel ----
function adminPanel(){
  modal(`<div class="h"><b>⚙ Users manage karo</b><button class="g" onclick="closeM()">✕</button></div><div class="form">
  <div id="ul"></div><hr style="border:0;border-top:1px solid var(--bd);width:100%">
  <b>Naya user</b>
  <input id="nn" placeholder="Naam (jaise: Mummy)"><input id="nu" placeholder="Username" autocapitalize="none"><input id="np" placeholder="Password (6+ akshar)">
  <select id="nr"><option value="member">Member (dekh/upload/download)</option><option value="admin">Admin</option></select>
  <div class="err" id="ne"></div><button onclick="newUser()">＋ User banao</button></div>`);
  userList();
}
function userList(){
  const el=$('ul');if(!el)return;
  el.innerHTML=users.map(u=>`<div class="row"><span><b>${esc(u.name)}</b> <small style="color:var(--mu)">@${esc(u.username)} · ${u.role}${u.active?'':' · band'}</small></span>
  <button class="g" onclick="resetPw('${u.id}','${esc(u.name).replace(/'/g,'')}')">🔑 Password</button>
  ${u.id===me.id?'':`<button class="g" onclick="toggleU('${u.id}',${!u.active})">${u.active?'Band karo':'Chalu karo'}</button>`}</div>`).join('');
}
async function toggleU(id,v){await db.collection('users').doc(id).update({active:v});setTimeout(userList,400)}
async function resetPw(id,name){
  const p=prompt(`"${name}" ka naya password (6+ akshar):`);if(!p)return;
  if(p.length<6){toast('Password 6+ akshar ka hona chahiye');return}
  try{toast('Password badal raha hai...',0);await api('resetPassword',{uid:id,password:p});toast('Password badal gaya ✅ User ko naya password bata do',5000)}
  catch(e){toast(e.message,6000)}
}
async function newUser(){
  const n=$('nn').value.trim(),u=$('nu').value.trim().toLowerCase().replace(/\s+/g,''),p=$('np').value,r=$('nr').value;
  if(!okU(u)){$('ne').textContent=UERR;return}
  if(!n||p.length<6){$('ne').textContent='Sab bharo, password 6+ akshar ka ho';return}
  try{
    const a2=firebase.auth(app2),c=await a2.createUserWithEmailAndPassword(em(u),p);
    await a2.signOut();
    await db.collection('users').doc(c.user.uid).set({name:n,username:u,role:r,active:true});
    toast(`${n} ka login ban gaya ✅`);adminPanel();
  }catch(e){$('ne').textContent=e.code==='auth/email-already-in-use'?'Ye username pehle se hai':e.message}
}
