<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ghar Docs">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ghar Documents</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1b2333;--mu:#6b7385;--pr:#4f46e5;--pr2:#eef0ff;--bd:#e4e7ee;--rd:#e5484d;--am:#b7791f;--am2:#fff4d6;--sh:0 2px 10px #1b23330d;--sh2:0 10px 28px #4f46e522}
[data-theme=dark]{--bg:#0d1119;--card:#171d2a;--tx:#e8ecf4;--mu:#97a0b3;--pr:#8b95ff;--pr2:#242b47;--bd:#262e40;--am:#f6c453;--am2:#3a2f12;--sh:0 2px 10px #0006;--sh2:0 10px 28px #0008}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);transition:background .2s}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:9px 14px;background:var(--pr);color:#fff;font-weight:600;transition:transform .12s,opacity .12s}
button:active{transform:scale(.96)}button:hover{opacity:.9}
button.g{background:var(--pr2);color:var(--pr)}button.d{background:transparent;color:var(--rd)}
input,select{font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:100%;outline:0}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px var(--pr2)}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.hide{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#db2777)}
.box{background:var(--card);border-radius:24px;padding:34px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px #0004;display:flex;flex-direction:column;gap:12px}
.box .ic{font-size:52px;text-align:center}.box h1{margin:0;text-align:center}.box p{color:var(--mu);text-align:center;margin:0}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap;box-shadow:0 4px 18px #4f46e544}
header h2{margin:0;font-size:18px;flex:1;min-width:150px}header small{opacity:.8;font-weight:400;font-size:13px}
header button.g{background:#ffffff26;color:#fff;padding:8px 12px}
main{max-width:1050px;margin:0 auto;padding:16px 16px 100px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;border:1px solid var(--bd)}
.st span{font-size:20px}.st b{font-size:20px}.st small{color:var(--mu);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:30px;box-shadow:var(--sh)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}.chip.add{border-style:dashed;color:var(--pr)}
#q{margin:4px 0;padding:13px 16px;border-radius:30px;box-shadow:var(--sh)}
.bar{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;align-items:center}.bar h3{margin:0;flex:1;min-width:140px}
.bar select{width:auto;padding:8px 10px;border-radius:30px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;border-radius:16px}
.grid.drop{outline:3px dashed var(--pr);outline-offset:6px;background:var(--pr2)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.card .t{font-size:30px;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--pr2)}
.t.im{background:#e0f5ec}.t.pd{background:#fde8e8}.t.fo{background:#fff1d6}
[data-theme=dark] .t.im{background:#12332a}[data-theme=dark] .t.pd{background:#3a1c1e}[data-theme=dark] .t.fo{background:#3a2f12}
.card b{word-break:break-word;font-size:14px;padding-right:22px}.card small{color:var(--mu)}
.card .nt{background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px}
.card .a{display:flex;gap:5px;margin-top:6px}.card .a button{flex:1;padding:7px 0}
.ck{position:absolute;top:14px;right:12px;width:20px;height:20px;padding:0;accent-color:var(--pr)}
.star{position:absolute;top:60px;left:12px;background:none!important;color:#f5a623;padding:0;font-size:21px;line-height:1}
.fold{cursor:pointer}.fold:hover{border-color:var(--pr)}
.empty{text-align:center;color:var(--mu);padding:60px 10px;grid-column:1/-1;font-size:15px}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;font-weight:600;width:fit-content}
.bd.red{background:#fde2e3;color:#b4232a}.bd.amb{background:var(--am2);color:var(--am)}
#rem{background:var(--am2);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
#rem .ri{cursor:pointer;padding:4px 0}
.modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.mb{background:var(--card);border-radius:20px;width:100%;max-width:820px;max-height:94vh;display:flex;flex-direction:column;overflow:auto}
.mb .h{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.mb .h b{flex:1;min-width:120px;word-break:break-word}
.pv{display:flex;align-items:center;justify-content:center;min-height:280px;background:var(--bg);overflow:auto}
.pv img,.pv iframe{max-width:100%;max-height:75vh;border:0;cursor:zoom-in}.pv img.z{max-width:none;max-height:none;width:200%;cursor:zoom-out}.pv iframe{width:100%;height:75vh;cursor:auto}
.form{padding:18px;display:flex;flex-direction:column;gap:12px}
.tpl{display:grid;grid-template-columns:1fr 1fr}.tpl button{padding:16px 8px}
.row2{display:flex;gap:8px}.row2 button{flex:1}
.row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.row span{flex:1;min-width:140px}
.err{color:var(--rd);text-align:center;font-size:14px;min-height:18px}
#selbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);box-shadow:0 8px 30px #0004;border-radius:30px;padding:8px 10px 8px 18px;display:flex;align-items:center;gap:6px;z-index:15;font-size:14px;max-width:96vw;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:30px;z-index:50;font-size:14px;max-width:90vw;text-align:center}
#prog{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,420px);background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 10px 40px #0005;padding:14px 16px;z-index:60}
#prog .r{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}#prog .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#prog small{color:var(--mu);display:block;margin-top:6px}
.pbar{height:10px;background:var(--pr2);border-radius:10px;overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#7c3aed,#db2777);border-radius:10px;transition:width .25s}
.pbar i.ind{width:40%!important;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
#topbar{height:4px;background:var(--pr2)}#topbar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#db2777);transition:width .3s}
.ld{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 20px;width:min(90%,360px);color:var(--mu)}
.ld .pbar{width:100%}
.sp{width:46px;height:46px;border-radius:50%;border:4px solid var(--pr2);border-top-color:var(--pr);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{height:150px;background:linear-gradient(90deg,var(--card) 25%,var(--pr2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
#drv{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh);font-size:14px}
#drv .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#drv small{color:var(--mu)}
#drv .pbar{margin-top:8px}#drv .pbar i.warn{background:linear-gradient(90deg,#f59e0b,#e5484d)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center"><div class="box">
  <div class="ic">🏠📁</div><h1>Ghar Documents</h1><p>Apna username aur password daalo</p>
  <div><label>Username</label><input id="lu" autocapitalize="none" autocomplete="username"></div>
  <div><label>Password</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <div class="err" id="le"></div>
  <button onclick="doLogin()">Login</button>
  <button id="setupLink" class="g hide" onclick="show('setup')">👑 Koi user nahi hai? Pehla Admin banao</button>
</div></div>

<!-- FIRST TIME ADMIN SETUP -->
<div id="setup" class="center hide"><div class="box">
  <div class="ic">🛡️</div><h1>Admin Setup</h1><p>Ye sirf ek baar hota hai. Ye account sabka manager hoga.</p>
  <div><label>Aapka naam</label><input id="sn"></div>
  <div><label>Username</label><input id="su" autocapitalize="none"></div>
  <div><label>Password (kam se kam 6 akshar)</label><input id="sp" type="password"></div>
  <div class="err" id="se"></div>
  <button onclick="doSetup()">Admin banao</button>
  <button class="g" onclick="show('login')">Wapas</button>
</div></div>

<!-- APP -->
<div id="app" class="hide">
  <header><span style="font-size:26px">📁</span><h2>Ghar Documents <small id="who"></small></h2>
    <button class="g hide" id="inst" onclick="installApp()">📲 Install</button>
    <button class="g" id="thb" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')">🌙</button>
    <button class="g" id="adm" onclick="adminPanel()">⚙ Admin</button>
    <button class="g" onclick="chPw()">🔑</button>
    <button class="g" onclick="auth.signOut()">Logout</button></header>
  <div id="topbar" class="hide"><i id="tbi"></i></div>
  <main>
    <div id="stats"></div>
    <div id="drv"></div>
    <div id="rem" class="hide"></div>
    <input id="q" placeholder="🔍 Sabhi documents me naam se khojo..." oninput="render()">
    <div class="chips" id="chips"></div>
    <div class="bar"><h3 id="ttl"></h3>
      <select id="sort" onchange="render()"><option value="new">🕒 Naye pehle</option><option value="name">🔤 Naam (A-Z)</option><option value="exp">⏰ Expiry</option></select>
      <span id="acts" style="display:flex;gap:8px;flex-wrap:wrap"></span></div>
    <div class="grid" id="grid"></div>
  </main>
  <div id="selbar" class="hide"><span id="selc"></span><button class="g" onclick="selAll()">Sab</button><button onclick="shareSel()">📲</button><button class="g" onclick="bulkDl()">⬇</button><button class="d" onclick="bulkDel()">🗑</button><button class="g" onclick="clearSel()">✕</button></div>
</div>

<div id="modal" class="modal hide" onclick="if(event.target===this)closeM()"><div class="mb" id="mb"></div></div>
<div id="toast" class="hide"></div>
<div id="prog" class="hide"><div class="r"><span id="pt"></span><span id="pp"></span></div><div class="pbar"><i id="pb"></i></div><small id="ps"></small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// ====== FIREBASE CONFIG ======
const CFG={
  apiKey:"AIzaSyAAIe5981RwbdW4dTnWLajTeDHMbBMQhZs",
  authDomain:"dialog-box-63269.firebaseapp.com",
  projectId:"dialog-box-63269",
  storageBucket:"dialog-box-63269.firebasestorage.app",
  messagingSenderId:"9414978030",
  appId:"1:9414978030:web:89c3330c8abc76734906ff"
};
// ====== APPS SCRIPT KA /exec LINK ======
const DRIVE_URL="https://script.google.com/macros/s/AKfycbwxYPKvNpNU8mp_oppfRBQDBa8Vz5fLwrO3pHQX6RTlY8s46m-QK6KHhOWGilPsjsb4/exec";
// =======================================
const app=firebase.initializeApp(CFG), app2=firebase.initializeApp(CFG,'sec');
const auth=firebase.auth(),db=firebase.firestore();
const $=id=>document.getElementById(id);
const okU=u=>/^[a-z0-9._-]{3,30}$/.test(u.trim().toLowerCase());
const UERR='Username me sirf English akshar, number, . _ - use karo (kam se kam 3, space ya @ nahi)';
const em=u=>u.trim().toLowerCase()+'@ghar-docs.app';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const size=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.ceil(b/1024)+' KB';
const icon=m=>m.startsWith('image/')?'🖼️':m==='application/pdf'?'📕':'📄';
const tc=m=>m.startsWith('image/')?'im':m==='application/pdf'?'pd':'';
const ext=f=>{const m=f.name.match(/\.[a-z0-9]+$/i);if(m)return m[0];const t=(f.type||'').split('/')[1];return t?'.'+t.replace('jpeg','jpg'):''};
const dayDiff=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(new Date().toDateString()))/864e5);
const TPL=[
  {k:'aadhar',ico:'🪪',folder:'Aadhar Card',slots:['Aadhar Front','Aadhar Back']},
  {k:'pan',ico:'💳',folder:'PAN Card',slots:['PAN Card']},
  {k:'voter',ico:'🗳️',folder:'Voter ID',slots:['Voter ID Front','Voter ID Back']},
  {k:'dl',ico:'🚗',folder:'Driving Licence',slots:['Driving Licence Front','Driving Licence Back']}
];
let me=null,members=[],folders=[],docs=[],users=[],cm=null,cf=null,view=null,unsubs=[],started=false,slotF={};
const sel=new Set(),ld={m:0,f:0,d:0};
let drv=null,drvTried=false;
const gb=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':size(b);
async function loadDrive(){try{const r=await api('storage');drv={used:+r.used,limit:+r.limit}}catch(e){drv={err:e.message}}drvRender()}
function drvRender(){
  const el=$('drv');if(!el)return;
  if(!drv){el.innerHTML='<div class="r"><b>☁️ Google Drive</b><small>⏳ Space check ho raha hai...</small></div><div class="pbar"><i class="ind"></i></div>';return}
  if(drv.err){el.innerHTML='<div class="r"><b>☁️ Google Drive</b><small>Space nahi dikha paaye</small></div><small>'+esc(drv.err)+' <a href="#" onclick="drv=null;loadDrive();drvRender();return false" style="color:var(--pr)">Dobara try karo</a></small>';return}
  const {used,limit}=drv,p=limit?Math.min(100,used/limit*100):0;
  el.innerHTML=`<div class="r"><b>☁️ Google Drive</b><span>${limit?`<b>${gb(Math.max(0,limit-used))}</b> khali · ${gb(limit)} me se`:gb(used)+' use hua'}</span></div>`
    +(limit?`<div class="pbar"><i class="${p>90?'warn':''}" style="width:${Math.max(p,1)}%"></i></div><small>${gb(used)} use hua (${p.toFixed(1)}%)${p>90?' ⚠ Space kam bachi hai':''}</small>`:'');
}
function prog(title,pct,sub){$('prog').classList.remove('hide');$('pt').textContent=title;$('ps').textContent=sub||'';const b=$('pb');if(pct==null){b.classList.add('ind');b.style.width='';$('pp').textContent=''}else{b.classList.remove('ind');b.style.width=Math.min(100,pct)+'%';$('pp').textContent=Math.round(pct)+'%'}}
function progEnd(){$('prog').classList.add('hide')}

// ---- theme ----
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}$('thb').textContent=t==='dark'?'☀️':'🌙'}
(function(){let t=null;try{t=localStorage.getItem('th')}catch(e){}setTheme(t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))})();

function show(id){['login','setup','app'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function toast(m,ms=2800){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(t._t);if(ms)t._t=setTimeout(()=>t.classList.add('hide'),ms)}
function modal(h){$('mb').innerHTML=h;$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide');$('mb').innerHTML=''}
const fail=e=>/invalid|wrong|not-found|credential/i.test(e.code+e.message)?'Username ya password galat hai':e.message;

// ---- first-time check ----
function checkSetup(){
  db.collection('config').doc('setup').get()
    .then(s=>$('setupLink').classList.toggle('hide',s.exists))
    .catch(()=>$('setupLink').classList.remove('hide'));
}
checkSetup();

// ---- login / setup ----
async function doLogin(){
  $('le').textContent='';
  if(!okU($('lu').value)){$('le').textContent=UERR;return}
  try{await auth.signInWithEmailAndPassword(em($('lu').value),$('lp').value)}catch(e){$('le').textContent=fail(e)}
}
async function doSetup(){
  const n=$('sn').value.trim(),u=$('su').value.trim(),p=$('sp').value;
  if(!okU(u)){$('se').textContent=UERR;return}
  if(!n||p.length<6){$('se').textContent='Sab bharo, password 6+ akshar ka ho';return}
  $('se').textContent='';let c;
  try{
    c=await auth.createUserWithEmailAndPassword(em(u),p);
    await db.collection('users').doc(c.user.uid).set({name:n,username:u.toLowerCase(),role:'admin',active:true});
    await db.collection('config').doc('setup').set({done:true,at:Date.now()});
  }catch(e){
    if(c&&c.user){try{await c.user.delete()}catch(x){}}
    $('se').textContent=e.code==='auth/email-already-in-use'
      ?'Ye username pehle se bana hua hai. Login screen par isi username/password se login karo, admin banane ka option wahin aa jayega'
      :e.message+(/permission/i.test(e.message)?' (Firestore rules publish kiye?)':'');
  }
}

auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];started=false;drv=null;drvTried=false;me=null;sel.clear();clearTimeout(window._np);
  if(!u){show('login');checkSetup();return}
  unsubs.push(db.collection('users').doc(u.uid).onSnapshot(s=>{
    if(!s.exists){
      clearTimeout(window._np);
      window._np=setTimeout(()=>noProfile(u),4000);
      return;
    }
    clearTimeout(window._np);
    me={id:s.id,...s.data()};me.name=me.name||me.username||(u.email||'').split('@')[0]||'User';
    if(me.active!==true){$('le').textContent='Is login ka access band hai ya profile me active=true nahi hai';me=null;auth.signOut();return}
    if(!started){started=true;startApp()}
    render();
  },e=>{$('le').textContent='Firestore se profile nahi padh paaye: '+e.message+' (Firestore rules publish kiye?)';auth.signOut()}));
});

async function noProfile(u){
  if(me)return;
  let first=false;
  try{first=!(await db.collection('config').doc('setup').get()).exists}catch(e){}
  if(first&&confirm('Abhi koi admin set up nahi hua hai, aur is login ka profile bhi nahi hai.\n\nIs login ko ADMIN bana dein?')){
    const n=prompt('Admin ka naam:','Admin');
    if(n&&n.trim()){
      try{
        await db.collection('users').doc(u.uid).set({name:n.trim(),username:(u.email||'').split('@')[0],role:'admin',active:true});
        await db.collection('config').doc('setup').set({done:true,at:Date.now()});
        return;
      }catch(e){$('le').textContent='Admin banane me error: '+e.message+(/permission/i.test(e.message)?' (Firestore rules publish kiye?)':'');auth.signOut();return}
    }
  }
  $('le').textContent='Profile nahi mila. Firestore > users me ek document chahiye jiska Document ID bilkul ye ho: '+u.uid+' (username nahi, ye UID)';
  auth.signOut();
}

function _snap(q,cb){return q.onSnapshot(cb,e=>{ld.m=ld.f=ld.d=1;toast('Data nahi padh paaye: '+e.message,6000);render()})}
function startApp(){
  ld.m=ld.f=ld.d=0;show('app');
  unsubs.push(_snap(db.collection('members').orderBy('name'),s=>{members=s.docs.map(d=>({id:d.id,...d.data()}));ld.m=1;if(!members.find(m=>m.id===cm)){cm=members[0]?.id||null;cf=null}render()}));
  unsubs.push(_snap(db.collection('folders').orderBy('createdAt'),s=>{folders=s.docs.map(d=>({id:d.id,...d.data()}));ld.f=1;render()}));

function expBadge(d){
  if(!d.expiry)return '';
  const n=dayDiff(d.expiry);
  if(n<0)return `<span class="bd red">❌ ${-n} din pehle expire</span>`;
  if(n<=30)return `<span class="bd amb">⏰ ${n} din baaki</span>`;
  return `<small>📅 Expiry: ${esc(d.expiry)}</small>`;
}
const srt=a=>{const s=$('sort').value,b=s==='name'?(x,y)=>x.name.localeCompare(y.name):s==='exp'?(x,y)=>(x.expiry||'9999')<(y.expiry||'9999')?-1:1:(x,y)=>y.createdAt-x.createdAt;return [...a].sort((x,y)=>(y.fav?1:0)-(x.fav?1:0)||b(x,y))};

// ---- Drive backend ----
function driveHint(u){
  if(!u||u.startsWith('PASTE'))return 'Pehle index.html me DRIVE_URL daalo (Apps Script ka /exec link)';
  if(u.includes('/library/'))return 'DRIVE_URL galat hai: ye Library ka link hai. Web app ka /exec link chahiye';
  if(u.includes('googleusercontent.com'))return 'DRIVE_URL galat hai: ye temporary echo link hai. script.google.com/macros/s/.../exec wala link chahiye';
  return '';
}
// fetch use hota hai (XHR upload listener se CORS preflight lagta hai jo Apps Script ko pasand nahi), isliye upload % andaza hai
async function post(body,onUp){
  let tm=null;
  if(onUp){const t0=Date.now(),tau=Math.max(2,body.length/250000);onUp(0);tm=setInterval(()=>onUp(Math.min(.97,1-Math.exp(-(Date.now()-t0)/1000/tau))),200)}
  try{const r=await fetch(DRIVE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});return await r.text()}
  finally{if(tm)clearInterval(tm)}
}
async function api(action,p={},cb={}){
  const h=driveHint(DRIVE_URL);if(h)throw new Error(h);
  const idToken=await auth.currentUser.getIdToken();
  let t;
  try{t=await post(JSON.stringify({action,idToken,...p}),cb.up)}
  catch(e){throw new Error('Drive server tak nahi pahunch paaye (link ya internet check karo)')}
  let j;try{j=JSON.parse(t)}catch(e){throw new Error('Drive backend ne galat jawab diya. Apps Script me "Who has access: Anyone" aur naya version deploy check karo')}
  if(!j.ok)throw new Error(/Unknown action/.test(j.error||'')?'Code.gs purana hai. Naya Code.gs paste karke New version deploy karo':(j.error||'Drive error'));
  return j;
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
async function shrink(f){
  if(!f.type.startsWith('image/')||f.size<1500000)return f;
  try{const im=await createImageBitmap(f),k=Math.min(1,2000/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||f),'image/jpeg',0.85));}catch(e){return f}
}
async function put(file,name,memberId,folderId,folderName,expiry,onP){
  const m=members.find(x=>x.id===memberId),fo=folders.find(x=>x.id===folderId);
  const blob=await shrink(file);
  if(blob!==file)name=name.replace(/\.[a-z0-9]+$/i,'')+'.jpg';
  if(blob.size>12*1048576)throw new Error('File 12 MB se badi hai');
  const mime=blob.type||file.type||'application/octet-stream';
  onP&&onP(0.05);const r=await api('upload',{memberName:m.name,folderName:folderName||fo.name,name,mime,data:await b64(blob)},{up:f=>onP&&onP(0.05+f*0.9)});onP&&onP(0.97);
  await db.collection('docs').add({memberId,folderId,name,driveId:r.id,mime,size:blob.size,expiry:expiry||null,by:me.name||me.username||'User',createdAt:Date.now()});
}

  const d=docs.find(x=>x.id===id);
  modal(`<div class="h"><b>${esc(d.name)}</b><button onclick="share('${id}')">📲 WhatsApp</button><button class="g" onclick="dl('${id}')">⬇ Download</button><button class="g" onclick="closeM()">✕</button></div>
  <div class="pv" id="pv"><div class="ld"><div class="sp"></div><div id="lt">Drive se load ho raha hai...</div><div class="pbar"><i id="lb" class="ind"></i></div></div></div>
  <div style="padding:10px;color:var(--mu);font-size:13px">Upload: ${esc(d.by||'')} · ${size(d.size)}${d.expiry?' · Expiry: '+esc(d.expiry):''}${d.note?' · 📝 '+esc(d.note):''}</div>`);
  try{
    const u=URL.createObjectURL(await fileBlob(d,f=>{const b=$('lb');if(b&&f!=null){b.classList.remove('ind');b.style.width=Math.round(f*100)+'%';$('lt').textContent='Load ho raha hai '+Math.round(f*100)+'%'}}));
    $('pv').innerHTML=d.mime.startsWith('image/')?`<img src="${u}" onclick="this.classList.toggle('z')" title="Zoom ke liye dabao">`:d.mime==='application/pdf'?`<iframe src="${u}"></iframe>`:`<div class="empty">Is file ka preview nahi ho sakta.<br>Download karke kholo.</div>`;
  }catch(e){$('pv').textContent='Error: '+e.message}
}
async function dl(id,quiet){
  const d=docs.find(x=>x.id===id);
  try{if(!quiet)prog('⬇ '+d.name,null,'Drive se aa raha hai...');const b=await fileBlob(d,f=>{if(!quiet&&f!=null)prog('⬇ '+d.name,f*100,'Download ho raha hai...')}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.name;a.click();if(!quiet){progEnd();toast('Download ho gaya ✅')}}
  catch(e){progEnd();toast(e.message)}
}
async function share(id){
  const d=docs.find(x=>x.id===id);
  try{
    prog('📲 '+d.name,null,'Drive se aa raha hai...');
    const b=await fileBlob(d,f=>{if(f!=null)prog('📲 '+d.name,f*100,'Taiyaar ho raha hai...')}),f=new File([b],d.name,{type:d.mime});
    progEnd();
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  }catch(e){progEnd();if(e.name!=='AbortError')toast(e.message);return}
  await dl(id);window.open('https://wa.me/?text='+encodeURIComponent(d.name),'_blank');
  toast('File download ho gayi, WhatsApp me attach karke bhejo',5000);
}

// ---- multi-select: WhatsApp / download / delete ----
const selDocs=()=>[...sel].map(id=>docs.find(x=>x.id===id)).filter(Boolean);
function tog(id,on){on?sel.add(id):sel.delete(id);selBar()}
function selBar(){$('selbar').classList.toggle('hide',!sel.size);$('selc').textContent=sel.size+' chuni'}
function clearSel(){sel.clear();render()}
function selAll(){document.querySelectorAll('.ck').forEach(c=>{sel.add(c.dataset.id);c.checked=true});selBar()}
async function bulkDl(){const ds=selDocs();for(const d of ds)await dl(d.id,true);toast(ds.length+' files download ho gayi ✅')}
async function bulkDel(){
  const ds=selDocs();if(!ds.length||!confirm(`${ds.length} files delete karni hain? Drive se bhi hat jayengi.`))return;
  await removeFiles(ds);sel.clear();toast('Delete ho gayi ✅');render();
}
async function shareSel(){
  const ds=selDocs();
  if(!ds.length)return;
  try{
    prog('📲 Files taiyaar ho rahi hain',0,'0/'+ds.length);
    const fs=[];for(let i=0;i<ds.length;i++){const d=ds[i];prog('📲 Files taiyaar ho rahi hain',i/ds.length*100,(i+1)+'/'+ds.length+' load ho rahi hai...');fs.push(new File([await fileBlob(d)],d.name,{type:d.mime}))}
    progEnd();
    if(navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs});return}
  }catch(e){progEnd();if(e.name!=='AbortError')toast(e.message);return}
  for(const d of ds)await dl(d.id,true);
  window.open('https://wa.me/?text='+encodeURIComponent(ds.map(d=>d.name).join(', ')),'_blank');
  toast('Files download ho gayi, WhatsApp me attach karke bhejo',5000);
}

// ---- password ----
async function chPw(){
  const p=prompt('Apna naya password (kam se kam 6 akshar):');if(!p)return;
  try{await auth.currentUser.updatePassword(p);toast('Password badal gaya ✅')}
  catch(e){toast(e.code==='auth/requires-recent-login'?'Logout karke dobara login karo, phir badlo':e.message)}
}

// ---- admin panel ----
function adminPanel(){
  modal(`<div class="h"><b>⚙ Users manage karo</b><button class="g" onclick="closeM()">✕</button></div><div class="form">
  <div id="ul"></div><hr style="border:0;border-top:1px solid var(--bd);width:100%">
  <b>Naya user</b>
  <input id="nn" placeholder="Naam (jaise: Mummy)"><input id="nu" placeholder="Username" autocapitalize="none"><input id="np" placeholder="Password (6+ akshar)">
  <select id="nr"><option value="member">Member (dekh/upload/download)</option><option value="admin">Admin</option></select>
  <div class="err" id="ne"></div><button onclick="newUser()">＋ User banao</button></div>`);
  userList();
}
function userList(){
  const el=$('ul');if(!el)return;
  el.innerHTML=users.map(u=>`<div class="row"><span><b>${esc(u.name)}</b> <small style="color:var(--mu)">@${esc(u.username)} · ${u.role}${u.active?'':' · band'}</small></span>
  <button class="g" onclick="resetPw('${u.id}','${esc(u.name).replace(/'/g,'')}')">🔑 Password</button>
  ${u.id===me.id?'':`<button class="g" onclick="toggleU('${u.id}',${!u.active})">${u.active?'Band karo':'Chalu karo'}</button>`}</div>`).join('');
}
async function toggleU(id,v){await db.collection('users').doc(id).update({active:v});setTimeout(userList,400)}
async function resetPw(id,name){
  const p=prompt(`"${name}" ka naya password (6+ akshar):`);if(!p)return;
  if(p.length<6){toast('Password 6+ akshar ka hona chahiye');return}
  try{toast('Password badal raha hai...',0);await api('resetPassword',{uid:id,password:p});toast('Password badal gaya ✅ User ko naya password bata do',5000)}
  catch(e){toast(e.message,6000)}
}
async function newUser(){
  const n=$('nn').value.trim(),u=$('nu').value.trim().toLowerCase().replace(/\s+/g,''),p=$('np').value,r=$('nr').value;
  if(!okU(u)){$('ne').textContent=UERR;return}
  if(!n||p.length<6){$('ne').textContent='Sab bharo, password 6+ akshar ka ho';return}
  try{
    const a2=firebase.auth(app2),c=await a2.createUserWithEmailAndPassword(em(u),p);
    await a2.signOut();
    await db.collection('users').doc(c.user.uid).set({name:n,username:u,role:r,active:true});
    toast(`${n} ka login ban gaya ✅`);adminPanel();
  }catch(e){$('ne').textContent=e.code==='auth/email-already-in-use'?'Ye username pehle se hai':e.message}
}

// ---- PWA ----
let dip=null;
window.addEventListener('beforeinstallprompt',e=>{dip=e;$('inst').classList.remove('hide')});
window.addEventListener('appinstalled',()=>$('inst').classList.add('hide'));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone)$('inst').classList.remove('hide');
async function installApp(){
  if(dip){dip.prompt();await dip.userChoice;dip=null;$('inst').classList.add('hide');return}
  modal(`<div class="h"><b>📲 App install karo</b><button class="g" onclick="closeM()">✕</button></div><div class="form">
  <p style="margin:0">iPhone/iPad (Safari) me: neeche <b>Share</b> button dabao, phir <b>"Add to Home Screen"</b> chuno.</p>
  <p style="margin:0;color:var(--mu);font-size:14px">Android (Chrome) me: upar teen dot menu me <b>"Install app"</b> ya <b>"Add to Home screen"</b> chuno.</p></div>`);
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
